version: '3.9'

services:
  # ─── MongoDB Replica Set ───────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: balancebook-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo-data:/data/db
    networks:
      - balancebook-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Initialises the replica set once
  mongo-initiate:
    image: mongo:7.0
    container_name: balancebook-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    networks:
      - balancebook-net
    entrypoint: >
      bash -c "sleep 5 && mongosh --host mongodb:27017 --quiet --eval
      'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}).ok }'"

  # ─── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balancebook-api
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/balancebook?replicaSet=rs0
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo-initiate:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    networks:
      - balancebook-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Frontend (Nginx serving built React) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: balancebook-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - balancebook-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  balancebook-net:
    driver: bridge

volumes:
  mongo-data:
  uploads:
