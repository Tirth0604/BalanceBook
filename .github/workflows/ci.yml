name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend tests + golden-path smoke
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      RATE_LIMIT_TEST: 0
      # config/env.js is zod-validated and fails fast without these; CI values are
      # throwaway secrets for an ephemeral in-process MongoDB, never real credentials.
      JWT_ACCESS_SECRET: ci-only-access-secret-please-rotate-32chars
      JWT_REFRESH_SECRET: ci-only-refresh-secret-please-rotate-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint --if-present

      - name: Unit tests (financial engine)
        working-directory: backend
        run: npx jest --runInBand tests/unit

      - name: Integration tests
        working-directory: backend
        run: npx jest --runInBand tests/integration
        env:
          NODE_ENV: test
          RATE_LIMIT_TEST: 0

      - name: Boot the API and walk the golden path
        working-directory: backend
        run: npm run smoke
        env:
          NODE_ENV: development

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npx vitest run

      - name: Production build
        working-directory: frontend
        run: npm run build
